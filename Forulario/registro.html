<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Registro</title>
</head>
<body>

    <header>
        <h1>Formulario de Registro</h1>
    </header>

    <hr>

    <section>
        <h2>Registro</h2>
        <form action="#" method="post">

            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej: Pedro Sanchez" required tabindex="1">
            <br><br>

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" placeholder="Ej: correo@ejemplo.com" required tabindex="2">
            <br><br>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required tabindex="3">
            <br><br>

            <label>Género:</label>
            <input type="radio" id="masculino" name="genero" value="masculino" tabindex="4">
            <label for="masculino">Masculino</label>
            <input type="radio" id="femenino" name="genero" value="femenino" tabindex="5">
            <label for="femenino">Femenino</label>
            <input type="radio" id="otro" name="genero" value="otro" tabindex="6">
            <label for="otro">Otro</label>
            <br><br>

            <label for="musica">Intereses:</label>
            <input type="checkbox" id="musica" name="intereses" value="musica" tabindex="7">
            <label for="musica">Música</label>
            <input type="checkbox" id="deporte" name="intereses" value="deporte" tabindex="8">
            <label for="deporte">Deporte</label>
            <input type="checkbox" id="lectura" name="intereses" value="lectura" tabindex="9">
            <label for="lectura">Lectura</label>
            <input type="checkbox" id="programacion" name="intereses" value="programacion" tabindex="10">
            <label for="programacion">Programación</label>
            <br><br>

            <label for="pais">País:</label>
            <select id="pais" name="pais" tabindex="11">
                <option value="argentina">Argentina</option>
                <option value="brasil">Brasil</option>
                <option value="chile">Chile</option>
            </select>
            <br><br>

            <label for="comentarios">Comentarios adicionales:</label>
            <br>
            <textarea id="comentarios" name="comentarios" rows="4" cols="40" placeholder="Escribí algún comentario..." tabindex="12"></textarea>
            <br><br>

            <input type="submit" value="Enviar" tabindex="13">

        </form>
    </section>

    <hr>

    <footer>
        <p>© 2025 - Jorge Lorenzo</p>
    </footer>

</body>
</html>
